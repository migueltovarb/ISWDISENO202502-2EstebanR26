<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcademiX - Sistema de Gestión Académica</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .landing-container {
            text-align: center;
            color: white;
            max-width: 600px;
            padding: 40px;
        }

        .logo {
            font-size: 80px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .btn-primary {
            background: white;
            color: #667eea;
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.3s, box-shadow 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 60px;
        }

        .feature {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .feature-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .feature h3 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .feature p {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="landing-container">
        <div class="logo">🎓</div>
        <h1>AcademiX</h1>
        <p>Sistema Integral de Gestión Académica</p>
        
        <a href="pages/login.html" class="btn-primary">Iniciar Sesión</a>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">📚</div>
                <h3>Cursos</h3>
                <p>Gestión completa de cursos e inscripciones</p>
            </div>
            <div class="feature">
                <div class="feature-icon">📊</div>
                <h3>Calificaciones</h3>
                <p>Seguimiento de notas y rendimiento</p>
            </div>
            <div class="feature">
                <div class="feature-icon">💳</div>
                <h3>Pagos</h3>
                <p>Sistema de pagos en línea</p>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        // Si ya está autenticado, redirigir al dashboard correspondiente
        if (auth.isAuthenticated()) {
            auth.redirectToDashboard();
        }
    </script>
</body>
</html>
